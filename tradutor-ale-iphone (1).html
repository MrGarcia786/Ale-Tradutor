<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tradutor — Alê Monteiro</title>
<style>
  :root {
    --graphite: #15171a;
    --panel-client: #1f2f38;
    --panel-ale: #202a20;
    --gold: #c9a24d;
    --patina: #6f9c86;
    --cream: #ede7da;
    --muted: #8a8f8a;
    --danger: #b56a4f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--graphite);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--cream);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  .zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    position: relative;
    min-height: 0;
    transition: filter 0.2s ease;
  }

  .zone-client { background: var(--panel-client); }
  .zone-ale { background: var(--panel-ale); }

  .zone.disabled { filter: brightness(0.55); pointer-events: none; }

  .zone-top-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .zone-label {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    opacity: 0.85;
  }

  .zone-client .zone-label { color: #e9d9b0; }
  .zone-ale .zone-label { color: #cfe3d5; }

  select.lang-select {
    background: rgba(0,0,0,0.25);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    font-size: 14px;
    padding: 5px 8px;
    font-family: inherit;
  }

  .mic-btn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    flex-shrink: 0;
  }

  .mic-btn:active { transform: scale(0.94); }

  .mic-btn.client { background: var(--gold); color: #21180a; }
  .mic-btn.ale { background: var(--patina); color: #0e1c14; }

  .mic-btn.listening { animation: pulse 1.1s ease-in-out infinite; }

  .finish-btn {
    display: none;
    border: none; border-radius: 10px; padding: 10px 18px;
    background: var(--danger); color: white; font-weight: 700;
    font-size: 15px; cursor: pointer;
  }
  .finish-btn.visible { display: inline-block; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.28); }
    50% { box-shadow: 0 0 0 16px rgba(255,255,255,0); }
  }

  .text-row {
    display: flex;
    width: 100%;
    max-width: 480px;
    gap: 6px;
  }

  .text-row input {
    flex: 1;
    min-width: 0;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: var(--cream);
    font-size: 16px;
    padding: 9px 12px;
    font-family: inherit;
  }

  .text-row input::placeholder { color: rgba(237,231,218,0.4); }

  .text-row button {
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }

  .zone-client .text-row button { background: var(--gold); color: #21180a; }
  .zone-ale .text-row button { background: var(--patina); color: #0e1c14; }

  .result {
    width: 100%;
    max-width: 480px;
    min-height: 1.3em;
    text-align: center;
    font-size: 20px;
    line-height: 1.3;
    font-family: Georgia, "Iowan Old Style", serif;
    word-wrap: break-word;
    padding: 0 6px;
  }

  .zone-client .result { color: #f5ecd8; }
  .zone-ale .result { color: #e2f0e6; }

  .source-text {
    font-size: 13px;
    opacity: 0.55;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin-top: -4px;
  }

  .status-bar {
    flex-shrink: 0;
    background: #0d0e10;
    padding: 8px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    min-height: 18px;
  }

  .status-bar.error { color: var(--danger); }

  .clear-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    opacity: 0.6;
    padding: 6px 8px;
  }

  .unsupported {
    position: fixed;
    inset: 0;
    background: var(--graphite);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    font-size: 17px;
    line-height: 1.5;
    z-index: 10;
  }

  .hidden { display: none; }
.quick-panel{background:#15171a;padding:12px 16px;max-height:25vh;overflow:auto}.quick-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.quick-btn{border:1px solid #c9a24d;background:#222;color:#ede7da;border-radius:8px;padding:8px;font-size:13px}.finish-btn{position:relative;z-index:20;touch-action:manipulation}
</style>
</head>
<body>

<div class="app">

  <div class="zone zone-client" id="zoneClient">
    <button class="clear-btn" id="clearClient">limpar</button>
    <div class="zone-top-row">
      <div class="zone-label">Cliente fala</div>
      <select class="lang-select" id="clientLang">
        <option value="en" selected>Inglês</option>
        <option value="de">Alemão</option>
        <option value="fr">Francês</option>
      </select>
    </div>
    <button class="mic-btn client" id="btnClient" aria-label="Ouvir cliente">🎙</button>
    <button class="finish-btn" id="finishClient">Terminei de falar</button>
    <div class="text-row">
      <input type="text" id="inputClient" placeholder="ou escreve aqui">
      <button id="sendClient">Traduzir</button>
    </div>
    <div class="source-text" id="sourceClient"></div>
    <div class="result" id="resultClient"></div>
  </div>

  <div class="status-bar" id="status">Toca num microfone ou escreve</div>

  <div class="zone zone-ale" id="zoneAle">
    <button class="clear-btn" id="clearAle">limpar</button>
    <div class="zone-label">Alê fala (Português)</div>
    <button class="mic-btn ale" id="btnAle" aria-label="Ouvir Alê">🎙</button>
    <button class="finish-btn" id="finishAle">Terminei de falar</button>
    <div class="text-row">
      <input type="text" id="inputAle" placeholder="ou escreve aqui">
      <button id="sendAle">Traduzir</button>
    </div>
    <div class="source-text" id="sourceAle"></div>
    <div class="result" id="resultAle"></div>
  </div>

</div>

<div class="unsupported hidden" id="unsupported">
  Este telemóvel ou navegador não suporta reconhecimento de voz.<br><br>
  Podes continuar a usar a caixa de texto normalmente — só a opção de microfone precisa do <strong>Google Chrome</strong>.
</div>

<script>
(function() {
  const LANGS = {
    en: { sttLang: 'en-US', speakLang: 'en-US' },
    de: { sttLang: 'de-DE', speakLang: 'de-DE' },
    fr: { sttLang: 'fr-FR', speakLang: 'fr-FR' }
  };

  let clientLangCode = 'en';
  const PT_TARGET = 'pt-BR';

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const statusEl = document.getElementById('status');

  const zoneClient = document.getElementById('zoneClient');
  const zoneAle = document.getElementById('zoneAle');
  const btnClient = document.getElementById('btnClient');
  const btnAle = document.getElementById('btnAle');
  const sourceClient = document.getElementById('sourceClient');
  const sourceAle = document.getElementById('sourceAle');
  const resultClient = document.getElementById('resultClient');
  const resultAle = document.getElementById('resultAle');
  const conversationLog = document.getElementById('conversationLog');
  const LOG_KEY = 'tradutorAleHistorico';
  let conversation = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
  function esc(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function renderLog(){conversationLog.innerHTML=conversation.length?conversation.map(e=>`<div class="log-entry"><small>${e.time} · ${e.side}</small><br>${esc(e.original)}<br><strong>→ ${esc(e.translation)}</strong></div>`).join(''):'Ainda não há traduções.';localStorage.setItem(LOG_KEY,JSON.stringify(conversation));}
  function addLog(side,original,translation){conversation.push({side,original,translation,time:new Date().toLocaleString('pt-BR')});renderLog();}
  const inputClient = document.getElementById('inputClient');
  const inputAle = document.getElementById('inputAle');
  const logStyle=document.createElement('style');logStyle.textContent='.log-panel{background:#15171a;padding:12px 16px;max-height:28vh;overflow:auto}.log-entry{padding:8px;margin:6px 0;background:#222;border-left:3px solid #c9a24d;font-size:13px}.log-entry small{color:#8a8f8a}';document.head.appendChild(logStyle);
  const logPanel=document.createElement('section');logPanel.className='log-panel';logPanel.innerHTML='<b>Histórico da conversa</b> <button id="clearLog">Limpar</button><div id="conversationLog"></div>';document.querySelector('.app').appendChild(logPanel);
  const clientLangSelect = document.getElementById('clientLang');
  document.querySelectorAll('.quick-btn').forEach(b=>b.addEventListener('click',()=>{inputAle.value=b.dataset.text;document.getElementById('sendAle').click();}));

  clientLangSelect.addEventListener('change', () => {
    clientLangCode = clientLangSelect.value;
  });

  document.getElementById('clearClient').onclick = () => {
    sourceClient.textContent = '';
    resultClient.textContent = '';
    inputClient.value = '';
  };
  document.getElementById('clearAle').onclick = () => {
    sourceAle.textContent = '';
    resultAle.textContent = '';
    inputAle.value = '';
  };

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle('error', !!isError);
  }

  function lockUI(locked) {
    zoneClient.classList.toggle('disabled', locked);
    zoneAle.classList.toggle('disabled', locked);
  }

  async function translate(text, from, to) {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data || !data.responseData || !data.responseData.translatedText) {
      throw new Error('sem tradução');
    }
    return data.responseData.translatedText;
  }

  function speak(text, langCode) {
    if (!('speechSynthesis' in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = langCode;
    utter.rate = 0.95;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  async function runTranslation(text, from, to, speakLang, sourceEl, resultEl) {
    sourceEl.textContent = text;
    resultEl.textContent = '';
    lockUI(true);
    setStatus('A traduzir…');
    try {
      const translated = await translate(text, from, to);
      resultEl.textContent = translated;
      addLog(sourceEl === sourceAle ? 'Alê' : 'Cliente', text, translated);
      setStatus('Pronto — toca ou escreve para a próxima frase');
      speak(translated, speakLang);
    } catch (err) {
      setStatus('Falha na tradução. Verifica a internet e tenta outra vez.', true);
    } finally {
      lockUI(false);
    }
  }

  // Text box handlers
  document.getElementById('sendClient').addEventListener('click', () => {
    const text = inputClient.value.trim();
    if (!text) return;
    runTranslation(text, clientLangCode, 'pt-BR', 'pt-BR', sourceClient, resultClient);
    inputClient.value = '';
  });
  inputClient.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('sendClient').click();
  });

  document.getElementById('sendAle').addEventListener('click', () => {
    const text = inputAle.value.trim();
    if (!text) return;
    runTranslation(text, 'pt-BR', clientLangCode, LANGS[clientLangCode].speakLang, sourceAle, resultAle);
    inputAle.value = '';
  });
  inputAle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('sendAle').click();
  });

  // Voice handlers (only if supported)
  if (!SpeechRecognition) {
    document.getElementById('unsupported').classList.remove('hidden');
    btnClient.style.display = 'none';
    btnAle.style.display = 'none';
    return;
  }

  function makeVoiceHandler({ btn, finishBtn, getSttLang, getFrom, getTo, getSpeakLang, sourceEl, resultEl }) {
    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    let listening = false;
    let stopping = false;
    let buffer = '';
    let stopTimer = null;

    btn.addEventListener('click', () => {
      if (stopping) return;

      if (!listening) {
        // Start a new listening session
        buffer = '';
        recognition.lang = getSttLang();
        sourceEl.textContent = '';
        resultEl.textContent = '';
        lockUI(true);
        btn.classList.add('listening');
        finishBtn.classList.add('visible');
        setStatus('A ouvir… fala com calma e toca em “Terminei de falar” quando acabares');
        try {
          recognition.start();
          listening = true;
        } catch (e) {
          lockUI(false);
          btn.classList.remove('listening');
        }
      } else {
        // Stop and translate what was captured
        stopping = true;
        finishBtn.classList.remove('visible');
        setStatus('A terminar…');
        try { recognition.stop(); } catch(e) {}
        stopTimer = setTimeout(()=>finishNow(), 1200);
      }
    });

    function finishNow(){ if(!listening) return; stopping=true; finishBtn.classList.remove('visible'); try{recognition.stop();}catch(e){} setTimeout(()=>{ if(listening){ listening=false; const text=buffer.trim(); buffer=''; if(text) runTranslation(text,getFrom(),getTo(),getSpeakLang(),sourceEl,resultEl); else lockUI(false); btn.classList.remove('listening'); }},700); }

    finishBtn.addEventListener('click', () => {
      if (listening && !stopping) {
        stopping = true;
        finishBtn.classList.remove('visible');
        setStatus('A terminar…');
        try { recognition.stop(); } catch(e) {}
        stopTimer = setTimeout(()=>finishNow(), 1200);
      }
    });

    recognition.onresult = (event) => {
      let finalChunk = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          finalChunk += event.results[i][0].transcript + ' ';
        } else {
          sourceEl.textContent = buffer + ' ' + event.results[i][0].transcript;
        }
      }
      if (finalChunk) {
        buffer = (buffer + ' ' + finalChunk).trim();
        sourceEl.textContent = buffer;
      }
    };

    recognition.onerror = (event) => {
      listening = false;
      stopping = false;
      btn.classList.remove('listening');
      lockUI(false);
      if (event.error === 'no-speech') {
        setStatus('Não percebi nada. Toca outra vez e fala.', true);
      } else if (event.error === 'not-allowed' || event.error === 'permission-denied') {
        setStatus('Falta autorização do microfone nas definições do telemóvel.', true);
      } else if (event.error === 'aborted') {
        // Happens on manual stop() in some browsers — not a real error.
      } else {
        setStatus('Algo falhou. Toca outra vez.', true);
      }
    };

    recognition.onend = async () => {
      const wasListening = listening;
      listening = false;
      stopping = false;
      btn.classList.remove('listening');
      finishBtn.classList.remove('visible');

      const text = buffer.trim();
      buffer = '';

      if (wasListening && text) {
        await runTranslation(text, getFrom(), getTo(), getSpeakLang(), sourceEl, resultEl);
      } else if (wasListening && !text) {
        setStatus('Não ouvi nada. Toca para tentar outra vez.', true);
        lockUI(false);
      } else {
        lockUI(false);
      }
    };
  }

  makeVoiceHandler({
    btn: btnClient,
    finishBtn: document.getElementById('finishClient'),
    getSttLang: () => LANGS[clientLangCode].sttLang,
    getFrom: () => clientLangCode,
    getTo: () => 'pt-BR',
    getSpeakLang: () => 'pt-BR',
    sourceEl: sourceClient,
    resultEl: resultClient
  });

  makeVoiceHandler({
    btn: btnAle,
    finishBtn: document.getElementById('finishAle'),
    getSttLang: () => 'pt-BR',
    getFrom: () => 'pt-BR',
    getTo: () => clientLangCode,
    getSpeakLang: () => LANGS[clientLangCode].speakLang,
    sourceEl: sourceAle,
    resultEl: resultAle
  });

})();
</script>

</body>
</html>
