<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tradutor">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23202a20' width='180' height='180'/><text x='50%' y='50%' font-size='80' fill='%236f9c86' text-anchor='middle' dominant-baseline='middle' font-family='Georgia'>🎙</text></svg>">
<link rel="manifest" href="data:application/json,{%22name%22:%22Tradutor%20Alê%20Monteiro%22,%22short_name%22:%22Tradutor%22,%22description%22:%22Tradução simultânea de conversas%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%2315171a%22,%22theme_color%22:%22%236f9c86%22,%22orientation%22:%22portrait%22}">
<title>Tradutor — Alê Monteiro</title>
<style>
  :root {
    --graphite: #15171a;
    --panel-client: #1f2f38;
    --panel-ale: #202a20;
    --gold: #c9a24d;
    --patina: #6f9c86;
    --cream: #ede7da;
    --muted: #8a8f8a;
    --danger: #b56a4f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--graphite);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--cream);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  .zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    position: relative;
    min-height: 0;
    transition: filter 0.2s ease;
  }

  .zone-client { background: var(--panel-client); }
  .zone-ale { background: var(--panel-ale); }

  .zone.disabled { filter: brightness(0.55); pointer-events: none; }

  .zone-top-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .zone-label {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    opacity: 0.85;
  }

  .zone-client .zone-label { color: #e9d9b0; }
  .zone-ale .zone-label { color: #cfe3d5; }

  select.lang-select {
    background: rgba(0,0,0,0.25);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    font-size: 14px;
    padding: 5px 8px;
    font-family: inherit;
  }

  .mic-btn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    flex-shrink: 0;
  }

  .mic-btn:active { transform: scale(0.94); }

  .mic-btn.client { background: var(--gold); color: #21180a; }
  .mic-btn.ale { background: var(--patina); color: #0e1c14; }

  .mic-btn.listening {
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.28); }
    50% { box-shadow: 0 0 0 16px rgba(255,255,255,0); }
  }

  .text-row {
    display: flex;
    width: 100%;
    max-width: 480px;
    gap: 6px;
  }

  .text-row input {
    flex: 1;
    min-width: 0;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: var(--cream);
    font-size: 16px;
    padding: 9px 12px;
    font-family: inherit;
  }

  .text-row input::placeholder { color: rgba(237,231,218,0.4); }

  .text-row button {
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }

  .zone-client .text-row button { background: var(--gold); color: #21180a; }
  .zone-ale .text-row button { background: var(--patina); color: #0e1c14; }

  .result {
    width: 100%;
    max-width: 480px;
    min-height: 1.3em;
    text-align: center;
    font-size: 20px;
    line-height: 1.3;
    font-family: Georgia, "Iowan Old Style", serif;
    word-wrap: break-word;
    padding: 0 6px;
  }

  .zone-client .result { color: #f5ecd8; }
  .zone-ale .result { color: #e2f0e6; }

  .source-text {
    font-size: 13px;
    opacity: 0.55;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin-top: -4px;
  }

  .status-bar {
    flex-shrink: 0;
    background: #0d0e10;
    padding: 8px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    min-height: 18px;
  }

  .status-bar.error { color: var(--danger); }

  .clear-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    opacity: 0.6;
    padding: 6px 8px;
  }

  .unsupported {
    position: fixed;
    inset: 0;
    background: var(--graphite);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    font-size: 17px;
    line-height: 1.5;
    z-index: 10;
  }

  .hidden { display: none !important; }

  .quick-btn {
    background: rgba(0,0,0,0.25);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    font-size: 14px;
    padding: 7px 14px;
    font-family: inherit;
  }

  .quick-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: flex-end;
    z-index: 20;
  }

  .quick-panel {
    width: 100%;
    max-height: 78vh;
    background: #1b1d20;
    border-radius: 18px 18px 0 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .quick-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 17px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .quick-close {
    background: none;
    border: none;
    color: var(--cream);
    font-size: 18px;
    padding: 4px 8px;
  }

  .quick-list {
    overflow-y: auto;
    padding: 10px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .quick-item {
    background: rgba(111,156,134,0.15);
    border: 1px solid rgba(111,156,134,0.4);
    color: var(--cream);
    text-align: left;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    font-family: inherit;
  }

  .quick-item:active { background: rgba(111,156,134,0.3); }

  .install-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.85);
    border-top: 1px solid rgba(111,156,134,0.5);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 25;
    gap: 12px;
  }

  .install-banner.hidden { display: none; }

  .install-text {
    font-size: 14px;
    color: #cfe3d5;
    flex: 1;
  }

  .install-btn {
    background: var(--patina);
    color: #0e1c14;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
  }

  .install-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
  }
</style>
</head>
<body>

<div class="app">

  <div class="zone zone-client" id="zoneClient">
    <button class="clear-btn" id="clearClient">limpar</button>
    <div class="zone-top-row">
      <div class="zone-label">Cliente fala</div>
      <select class="lang-select" id="clientLang">
        <option value="en" selected>Inglês</option>
        <option value="de">Alemão</option>
        <option value="fr">Francês</option>
      </select>
    </div>
    <button class="mic-btn client" id="btnClient" aria-label="Ouvir cliente">🎙</button>
    <div class="text-row">
      <input type="text" id="inputClient" placeholder="ou escreve aqui">
      <button id="sendClient">Traduzir</button>
    </div>
    <div class="source-text" id="sourceClient"></div>
    <div class="result" id="resultClient"></div>
  </div>

  <div class="status-bar" id="status">Toca num microfone ou escreve</div>

  <div class="zone zone-ale" id="zoneAle">
    <button class="clear-btn" id="clearAle">limpar</button>
    <div class="zone-label">Alê fala (Português)</div>
    <button class="mic-btn ale" id="btnAle" aria-label="Ouvir Alê">🎙</button>
    <button class="quick-btn" id="openQuick">⚡ Frases rápidas</button>
    <div class="text-row">
      <input type="text" id="inputAle" placeholder="ou escreve aqui">
      <button id="sendAle">Traduzir</button>
    </div>
    <div class="source-text" id="sourceAle"></div>
    <div class="result" id="resultAle"></div>
  </div>

</div>

<div class="quick-overlay hidden" id="quickOverlay">
  <div class="quick-panel">
    <div class="quick-header">
      <span>Frases rápidas</span>
      <button id="closeQuick" class="quick-close">✕</button>
    </div>
    <div class="quick-list" id="quickList"></div>
  </div>
</div>

<div class="install-banner hidden" id="installBanner">
  <div class="install-text">Adiciona à tela inicial para acesso rápido</div>
  <button class="install-btn" id="installBtn">Instalar</button>
  <button class="install-close" id="closeInstall">✕</button>
</div>

<div style="position:fixed;bottom:2px;right:6px;font-size:10px;color:rgba(255,255,255,0.25);z-index:5;">v7</div>

<div class="unsupported hidden" id="unsupported">
  Este telemóvel ou navegador não suporta reconhecimento de voz.<br><br>
  Podes continuar a usar a caixa de texto normalmente — só a opção de microfone precisa do <strong>Google Chrome</strong>.
</div>

<script>
// Install banner logic
let deferredPrompt = null;
const installBanner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');
const closeInstall = document.getElementById('closeInstall');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.classList.remove('hidden');
});

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`Instalação: ${outcome}`);
    deferredPrompt = null;
    installBanner.classList.add('hidden');
  }
});

closeInstall.addEventListener('click', () => {
  installBanner.classList.add('hidden');
});

// iOS detection: show banner for iOS
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
if (IS_IOS && !window.navigator.standalone) {
  installBanner.innerHTML = '<div class="install-text">Toca em Partilhar e depois em "Adicionar a ecrã principal"</div><button class="install-close" style="margin-left:auto;">✕</button>';
  installBanner.classList.remove('hidden');
  installBanner.querySelector('.install-close').addEventListener('click', () => {
    installBanner.classList.add('hidden');
  });
}

(function() {
  const LANGS = {
    en: { sttLang: 'en-US', speakLang: 'en-US' },
    de: { sttLang: 'de-DE', speakLang: 'de-DE' },
    fr: { sttLang: 'fr-FR', speakLang: 'fr-FR' }
  };

  let clientLangCode = 'en';

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const statusEl = document.getElementById('status');

  const zoneClient = document.getElementById('zoneClient');
  const zoneAle = document.getElementById('zoneAle');
  const btnClient = document.getElementById('btnClient');
  const btnAle = document.getElementById('btnAle');
  const sourceClient = document.getElementById('sourceClient');
  const sourceAle = document.getElementById('sourceAle');
  const resultClient = document.getElementById('resultClient');
  const resultAle = document.getElementById('resultAle');
  const inputClient = document.getElementById('inputClient');
  const inputAle = document.getElementById('inputAle');
  const clientLangSelect = document.getElementById('clientLang');

  clientLangSelect.addEventListener('change', () => {
    clientLangCode = clientLangSelect.value;
  });

  document.getElementById('clearClient').onclick = () => {
    sourceClient.textContent = '';
    resultClient.textContent = '';
    inputClient.value = '';
  };
  document.getElementById('clearAle').onclick = () => {
    sourceAle.textContent = '';
    resultAle.textContent = '';
    inputAle.value = '';
  };

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle('error', !!isError);
  }

  function lockUI(locked) {
    zoneClient.classList.toggle('disabled', locked);
    zoneAle.classList.toggle('disabled', locked);
  }

  async function translate(text, from, to) {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data || !data.responseData || !data.responseData.translatedText) {
      throw new Error('sem tradução');
    }
    return data.responseData.translatedText;
  }

  function speak(text, langCode) {
    if (!('speechSynthesis' in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = langCode;
    utter.rate = 0.95;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  async function runTranslation(text, from, to, speakLang, sourceEl, resultEl) {
    sourceEl.textContent = text;
    resultEl.textContent = '';
    lockUI(true);
    setStatus('A traduzir…');
    try {
      const translated = await translate(text, from, to);
      resultEl.textContent = translated;
      setStatus('Pronto — toca ou escreve para a próxima frase');
      speak(translated, speakLang);
    } catch (err) {
      setStatus('Falha na tradução. Verifica a internet e tenta outra vez.', true);
    } finally {
      lockUI(false);
    }
  }

  const QUICK_PHRASES = [
    'Bem-vinda(o) à Danna Tavira Design Shop',
    'Um pouco de tudo, para quem já tem tudo',
    'Isto é prata de lei, feito à mão',
    'Posso ajudar em alguma coisa?',
    'Este é o preço em euros',
    'Aceitamos cartão e dinheiro',
    'Fica muito bem em si',
    'Obrigada pela visita, volte sempre'
  ];

  const quickOverlay = document.getElementById('quickOverlay');
  const quickList = document.getElementById('quickList');

  QUICK_PHRASES.forEach((phrase) => {
    const btn = document.createElement('button');
    btn.className = 'quick-item';
    btn.textContent = phrase;
    btn.addEventListener('click', () => {
      quickOverlay.classList.add('hidden');
      runTranslation(phrase, 'pt-BR', clientLangCode, LANGS[clientLangCode].speakLang, sourceAle, resultAle);
    });
    quickList.appendChild(btn);
  });

  document.getElementById('openQuick').addEventListener('click', () => {
    quickOverlay.classList.remove('hidden');
  });
  document.getElementById('closeQuick').addEventListener('click', () => {
    quickOverlay.classList.add('hidden');
  });
  quickOverlay.addEventListener('click', (e) => {
    if (e.target === quickOverlay) quickOverlay.classList.add('hidden');
  });

  // Text box handlers
  document.getElementById('sendClient').addEventListener('click', () => {
    const text = inputClient.value.trim();
    if (!text) return;
    runTranslation(text, clientLangCode, 'pt-BR', 'pt-BR', sourceClient, resultClient);
    inputClient.value = '';
  });
  inputClient.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('sendClient').click();
  });

  document.getElementById('sendAle').addEventListener('click', () => {
    const text = inputAle.value.trim();
    if (!text) return;
    runTranslation(text, 'pt-BR', clientLangCode, LANGS[clientLangCode].speakLang, sourceAle, resultAle);
    inputAle.value = '';
  });
  inputAle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('sendAle').click();
  });

  // Voice handlers (only if supported)
  if (!SpeechRecognition) {
    document.getElementById('unsupported').classList.remove('hidden');
    btnClient.style.display = 'none';
    btnAle.style.display = 'none';
    return;
  }

  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  function makeVoiceHandler({ btn, getSttLang, getFrom, getTo, getSpeakLang, sourceEl, resultEl }) {
    const recognition = new SpeechRecognition();
    recognition.continuous = IS_IOS;
    recognition.interimResults = IS_IOS;
    recognition.maxAlternatives = 1;

    let listening = false;
    let stopping = false;
    let buffer = '';

    btn.addEventListener('click', () => {
      if (stopping) return;

      if (IS_IOS) {
        if (!listening) {
          buffer = '';
          recognition.lang = getSttLang();
          sourceEl.textContent = '';
          resultEl.textContent = '';
          lockUI(true);
          btn.classList.add('listening');
          setStatus('A ouvir… toca outra vez quando terminares');
          try {
            recognition.start();
            listening = true;
          } catch (e) {
            lockUI(false);
            btn.classList.remove('listening');
          }
        } else {
          stopping = true;
          setStatus('A terminar…');
          recognition.stop();
        }
        return;
      }

      // Android / desktop: single-shot, auto-stops on silence.
      if (listening) return;
      listening = true;
      recognition.lang = getSttLang();
      sourceEl.textContent = '';
      resultEl.textContent = '';
      lockUI(true);
      btn.classList.add('listening');
      setStatus('A ouvir…');
      try {
        recognition.start();
      } catch (e) {
        console.error('Speech Recognition error:', e);
        listening = false;
        lockUI(false);
        btn.classList.remove('listening');
        setStatus('Erro ao iniciar gravação. Tenta outra vez.', true);
      }
    });

    recognition.onstart = () => {
      console.log('Speech recognition started');
    };

    recognition.onresult = async (event) => {
      console.log('Speech result received', event);
      if (!IS_IOS) {
        const transcript = event.results[0][0].transcript;
        btn.classList.remove('listening');
        listening = false;
        await runTranslation(transcript, getFrom(), getTo(), getSpeakLang(), sourceEl, resultEl);
        return;
      }

      let finalChunk = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          finalChunk += event.results[i][0].transcript + ' ';
        } else {
          sourceEl.textContent = (buffer + ' ' + event.results[i][0].transcript).trim();
        }
      }
      if (finalChunk) {
        buffer = (buffer + ' ' + finalChunk).trim();
        sourceEl.textContent = buffer;
      }
    };

    recognition.onerror = (event) => {
      console.error('Speech recognition error:', event.error);
      listening = false;
      stopping = false;
      btn.classList.remove('listening');
      lockUI(false);
      if (event.error === 'no-speech') {
        setStatus('Não percebi nada. Toca outra vez e fala.', true);
      } else if (event.error === 'not-allowed' || event.error === 'permission-denied') {
        setStatus('Falta autorização do microfone nas definições do telemóvel.', true);
      } else if (event.error === 'aborted') {
        // Happens on manual stop() — not a real error.
      } else {
        setStatus(`Erro: ${event.error}. Toca outra vez.`, true);
      }
    };

    recognition.onend = async () => {
      console.log('Speech recognition ended');
      if (!IS_IOS) {
        // Single-shot mode: onresult already handled everything,
        // or nothing was heard — either way just release the UI.
        listening = false;
        btn.classList.remove('listening');
        if (!stopping) lockUI(false);
        stopping = false;
        return;
      }

      const wasListening = listening;
      listening = false;
      stopping = false;
      btn.classList.remove('listening');

      const text = buffer.trim();
      buffer = '';

      if (wasListening && text) {
        await runTranslation(text, getFrom(), getTo(), getSpeakLang(), sourceEl, resultEl);
      } else if (wasListening && !text) {
        setStatus('Não ouvi nada. Toca para tentar outra vez.', true);
        lockUI(false);
      } else {
        lockUI(false);
      }
    };
  }

  makeVoiceHandler({
    btn: btnClient,
    getSttLang: () => LANGS[clientLangCode].sttLang,
    getFrom: () => clientLangCode,
    getTo: () => 'pt-BR',
    getSpeakLang: () => 'pt-BR',
    sourceEl: sourceClient,
    resultEl: resultClient
  });

  makeVoiceHandler({
    btn: btnAle,
    getSttLang: () => 'pt-BR',
    getFrom: () => 'pt-BR',
    getTo: () => clientLangCode,
    getSpeakLang: () => LANGS[clientLangCode].speakLang,
    sourceEl: sourceAle,
    resultEl: resultAle
  });

})();
</script>

</body>
</html>
